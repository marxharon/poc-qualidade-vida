
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolução Longitudinal - Categorias ESG</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        p { text-align: center; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Evolução Longitudinal da Pontuação (RM-ANOVA)</h2>
        <p>Acompanhamento da progressão dos Gêmeos Organizacionais ao longo dos meses simulados.</p>
        <canvas id="graficoEvolucao"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ["2026-03","2026-04","2026-05"],
                datasets: [{"label":"Colaboradores engajados em projetos de inovação","data":[75,74,71],"fill":false,"borderColor":"hsl(0, 70%, 50%)","backgroundColor":"hsl(0, 70%, 50%)","tension":0.1},{"label":"Colaboradores multitarefas sobrecarregados","data":[78,80,73],"fill":false,"borderColor":"hsl(72, 70%, 50%)","backgroundColor":"hsl(72, 70%, 50%)","tension":0.1},{"label":"Colaboradores desmotivados em ambiente tradicional","data":[65,67,67],"fill":false,"borderColor":"hsl(144, 70%, 50%)","backgroundColor":"hsl(144, 70%, 50%)","tension":0.1},{"label":"Colaboradores em busca de equilíbrio entre vida pessoal e profissional","data":[80,79,80],"fill":false,"borderColor":"hsl(216, 70%, 50%)","backgroundColor":"hsl(216, 70%, 50%)","tension":0.1},{"label":"Colaboradores em constante aprendizado e desenvolvimento","data":[74,77,79],"fill":false,"borderColor":"hsl(288, 70%, 50%)","backgroundColor":"hsl(288, 70%, 50%)","tension":0.1}]
            },
            options: {
                responsive: true,
                scales: {
                    y: { min: 0, max: 100, title: { display: true, text: 'Pontuação Agregada' } },
                    x: { title: { display: true, text: 'Mês (Ano-Mês)' } }
                }
            }
        });
    </script>
</body>
</html>
